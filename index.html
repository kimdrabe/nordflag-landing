<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NORDFLAG — Webagentur aus Lübeck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: Inter, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #25282b;
      background: #ffffff;
    }

    :root {
      --primary: #0055a4;
      --on-primary: #ffffff;
      --ink: #25282b;
      --body: #7e7e7e;
      --mute: #bebebe;
      --canvas: #ffffff;
      --canvas-soft: #f2f2f2;
      --on-dark: #ffffff;
    }

    .nav-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--ink);
      padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 12px;
      color: var(--on-dark); text-decoration: none;
    }
    .nav-logo-orb {
      width: 36px; height: 36px;
      background: var(--primary);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--on-primary);
      font-size: 18px; font-weight: 800; line-height: 1;
    }
    .nav-logo-text {
      font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .nav-links {
      display: flex; align-items: center; gap: 32px; list-style: none;
    }
    .nav-links a {
      color: var(--on-dark); text-decoration: none;
      font-size: 16px; font-weight: 400; line-height: 20px;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.7; }
    .nav-cta {
      background: var(--primary); color: var(--on-primary);
      border: 1px solid var(--primary);
      font-size: 18px; font-weight: 400; line-height: 28px;
      padding: 12px 24px; border-radius: 60px;
      text-decoration: none; cursor: pointer;
      transition: opacity 0.2s;
    }
    .nav-cta:hover { opacity: 0.85; }
    .nav-hamburger {
      display: none; flex-direction: column; gap: 5px; cursor: pointer;
      background: none; border: none; padding: 4px;
    }
    .nav-hamburger span {
      display: block; width: 24px; height: 2px; background: var(--on-dark);
      border-radius: 2px;
    }
    #nav-toggle { display: none; }

    .hero {
      background: var(--ink);
      color: var(--on-dark);
      padding: 140px 32px 100px;
      min-height: 100vh;
      display: flex; align-items: center;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 50%, rgba(0,85,164,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 20% 80%, rgba(0,85,164,0.06) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-content { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; width: 100%; }
    .hero-eyebrow {
      font-size: 16px; font-weight: 800; line-height: 24px;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 24px; color: var(--primary);
    }
    .hero h1 {
      font-size: clamp(48px, 10vw, 144px);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -1px;
      text-transform: uppercase;
      max-width: 4.5ch;
      margin-bottom: 32px;
    }
    .hero-lead {
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 400; line-height: 1.4;
      max-width: 480px; margin-bottom: 48px;
      color: rgba(255,255,255,0.75);
    }
    .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; }
    .btn-primary {
      background: var(--primary); color: var(--on-primary);
      border: 1px solid var(--primary);
      font-size: 18px; font-weight: 400; line-height: 28px;
      padding: 12px 24px; border-radius: 60px;
      text-decoration: none; cursor: pointer; display: inline-block;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-outline-light {
      background: transparent; color: var(--on-dark);
      border: 1px solid var(--on-dark);
      font-size: 18px; font-weight: 400; line-height: 28px;
      padding: 12px 24px; border-radius: 60px;
      text-decoration: none; cursor: pointer; display: inline-block;
      transition: background 0.2s;
    }
    .btn-outline-light:hover { background: rgba(255,255,255,0.1); }
    .btn-outline-dark {
      background: var(--canvas); color: var(--ink);
      border: 1px solid var(--ink);
      font-size: 18px; font-weight: 400; line-height: 28px;
      padding: 12px 24px; border-radius: 60px;
      text-decoration: none; cursor: pointer; display: inline-block;
      transition: background 0.2s;
    }
    .btn-outline-dark:hover { background: var(--canvas-soft); }
    .btn-outline-red {
      background: var(--canvas); color: var(--primary);
      border: 1px solid var(--primary);
      font-size: 18px; font-weight: 400; line-height: 28px;
      padding: 12px 24px; border-radius: 60px;
      text-decoration: none; cursor: pointer; display: inline-block;
      transition: background 0.2s;
    }
    .btn-outline-red:hover { background: #f0f6ff; }

    .speechmark {
      display: flex; align-items: center; justify-content: center;
      width: 56px; height: 56px;
      background: var(--primary);
      border-radius: 6px;
      color: var(--on-primary);
      font-size: 28px; font-weight: 800; line-height: 1;
    }

    .band {
      padding: 96px 32px;
    }
    .band-content {
      max-width: 1200px; margin: 0 auto;
    }
    .band-light { background: var(--canvas); }
    .band-soft { background: var(--canvas-soft); }

    .section-eyebrow {
      font-size: 16px; font-weight: 800; line-height: 24px;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--primary); margin-bottom: 12px;
    }
    .section-title {
      font-size: clamp(36px, 4vw, 48px);
      font-weight: 300;
      line-height: 1.08;
      margin-bottom: 20px;
    }
    .section-title strong { font-weight: 800; }
    .section-desc {
      font-size: 18px; font-weight: 400; line-height: 28px;
      color: var(--body);
      max-width: 600px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px; margin-top: 64px;
    }
    .service-card {
      background: var(--canvas);
      border-radius: 6px; padding: 16px;
      transition: transform 0.2s;
    }
    .service-card:hover { transform: translateY(-2px); }
    .service-card-icon {
      width: 48px; height: 48px;
      background: var(--primary); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--on-primary);
      font-size: 22px; font-weight: 800; margin-bottom: 20px;
    }
    .service-card h3 {
      font-size: 24px; font-weight: 700; line-height: 24px;
      margin-bottom: 12px;
    }
    .service-card p {
      font-size: 16px; font-weight: 400; line-height: 20px;
      color: var(--body);
    }

    .badge-chip {
      display: inline-block;
      background: var(--canvas-soft); color: var(--ink);
      font-size: 14px; font-weight: 700; line-height: 21px;
      padding: 4px 12px; border-radius: 32px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 32px; margin-top: 64px;
    }
    .stat-item { text-align: center; }
    .stat-number {
      font-size: clamp(40px, 5vw, 48px);
      font-weight: 300; line-height: 1.08;
      margin-bottom: 8px;
    }
    .stat-number strong { font-weight: 800; }
    .stat-label {
      font-size: 14px; font-weight: 700; line-height: 21px;
      color: var(--body);
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 32px; margin-top: 64px;
    }
    .process-step { text-align: center; }
    .process-number {
      font-size: 72px; font-weight: 800; line-height: 1;
      color: var(--primary); margin-bottom: 16px;
    }
    .process-step h3 {
      font-size: 24px; font-weight: 700; line-height: 24px;
      margin-bottom: 12px;
    }
    .process-step p {
      font-size: 16px; font-weight: 400; line-height: 20px;
      color: var(--body);
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px; margin-top: 64px;
    }
    .work-card {
      background: var(--canvas-soft);
      border-radius: 6px; overflow: hidden;
    }
    .work-card-img {
      width: 100%; aspect-ratio: 16 / 9;
      background: var(--mute); display: flex;
      align-items: center; justify-content: center;
      color: var(--body); font-size: 14px; font-weight: 600; text-transform: uppercase;
    }
    .work-card-body { padding: 16px; }
    .work-card-body h3 {
      font-size: 24px; font-weight: 700; line-height: 24px;
      margin-bottom: 4px;
    }
    .work-card-body p {
      font-size: 16px; font-weight: 400; line-height: 20px;
      color: var(--body); margin-bottom: 16px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px; margin-top: 64px;
    }
    .contact-info h3 {
      font-size: 24px; font-weight: 700; line-height: 24px;
      margin-bottom: 16px;
    }
    .contact-info p {
      font-size: 16px; font-weight: 400; line-height: 20px;
      color: var(--body); margin-bottom: 8px;
    }
    .contact-info a {
      color: var(--ink); text-decoration: none;
      border-bottom: 1px solid var(--mute);
    }
    .contact-info a:hover { border-color: var(--primary); color: var(--primary); }
    .contact-form { display: flex; flex-direction: column; gap: 16px; }
    .contact-form input,
    .contact-form textarea {
      background: var(--canvas); color: var(--ink);
      border: 1px solid var(--ink);
      font-size: 16px; font-weight: 400; line-height: 20px;
      padding: 12px 16px; border-radius: 6px; font-family: inherit;
      outline: none; transition: border-color 0.2s;
    }
    .contact-form input:focus,
    .contact-form textarea:focus { border-color: var(--primary); }
    .contact-form textarea { min-height: 120px; resize: vertical; }

    .footer {
      background: var(--ink); color: var(--on-dark);
      padding: 96px 32px 32px;
    }
    .footer-grid {
      max-width: 1200px; margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 48px;
    }
    .footer-brand .nav-logo-text { font-size: 18px; }
    .footer-brand p {
      font-size: 14px; font-weight: 400; line-height: 16px;
      color: rgba(255,255,255,0.55);
      margin-top: 16px; max-width: 280px;
    }
    .footer-col h4 {
      font-size: 12px; font-weight: 600; line-height: 16px;
      text-transform: uppercase; letter-spacing: 0.57px;
      margin-bottom: 20px; color: rgba(255,255,255,0.5);
    }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .footer-col a {
      color: var(--on-dark); text-decoration: none;
      font-size: 16px; font-weight: 400; line-height: 20px;
      transition: opacity 0.2s;
    }
    .footer-col a:hover { opacity: 0.6; }
    .footer-bottom {
      max-width: 1200px; margin: 64px auto 0; padding-top: 32px;
      border-top: 1px solid rgba(255,255,255,0.2);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .footer-bottom p {
      font-size: 14px; font-weight: 400; line-height: 16px;
      color: rgba(255,255,255,0.4);
    }

    @media (max-width: 1023px) {
      .contact-grid { grid-template-columns: 1fr; gap: 32px; }
      .footer-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 767px) {
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
      #nav-toggle:checked ~ .nav-links {
        display: flex; position: fixed; top: 68px; left: 0; right: 0;
        flex-direction: column; background: var(--ink);
        padding: 24px 32px; gap: 20px; align-items: stretch;
      }
      #nav-toggle:checked ~ .nav-links .nav-cta { text-align: center; }
      .hero { padding: 120px 20px 80px; }
      .hero h1 { max-width: 100%; }
      .band { padding: 64px 20px; }
      .services-grid { grid-template-columns: 1fr; }
      .work-grid { grid-template-columns: 1fr; }
      .process-grid { grid-template-columns: 1fr 1fr; }
      .footer-grid { grid-template-columns: 1fr; }
      .footer-bottom { flex-direction: column; }
    }
    @media (max-width: 480px) {
      .process-grid { grid-template-columns: 1fr; }
    }

    .cms-badge {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      background: var(--ink); color: var(--on-dark);
      padding: 12px 20px; border-radius: 60px; text-decoration: none;
      font-size: 14px; font-weight: 700; line-height: 21px;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2); transition: opacity 0.2s;
    }
    .cms-badge:hover { opacity: 0.85; }
    .cms-badge-orb {
      width: 24px; height: 24px; background: var(--primary);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <a href="#" class="nav-logo">
      <span class="nav-logo-orb">NF</span>
      <span class="nav-logo-text">Nordflag</span>
    </a>
    <input type="checkbox" id="nav-toggle" hidden />
    <label for="nav-toggle" class="nav-hamburger" aria-label="Menü öffnen">
      <span></span><span></span><span></span>
    </label>
    <ul class="nav-links">
      <li><a href="#leistungen">Leistungen</a></li>
      <li><a href="#prozess">Prozess</a></li>
      <li><a href="#arbeiten">Arbeiten</a></li>
      <li><a href="#kontakt">Kontakt</a></li>
      <li><a href="#kontakt" class="nav-cta">Projekt starten</a></li>
    </ul>
  </nav>

  <section class="hero" id="start">
    <div class="hero-content" id="hero-content"></div>
  </section>

  <section class="band band-light" id="leistungen">
    <div class="band-content" id="services-content"></div>
  </section>

  <section class="band band-soft">
    <div class="band-content" id="stats-content" style="text-align: center;"></div>
  </section>

  <section class="band band-light" id="prozess">
    <div class="band-content" id="process-content"></div>
  </section>

  <section class="band band-soft" id="arbeiten">
    <div class="band-content" id="portfolios-content"></div>
  </section>

  <section class="band band-light" id="kontakt">
    <div class="band-content" id="contact-content"></div>
  </section>

  <footer class="footer" id="footer-content"></footer>

  <a href="/admin/" class="cms-badge" target="_blank">
    <span class="cms-badge-orb">C</span>
    Inhalt bearbeiten
  </a>

  <script>
    const CACHE_BUST = Date.now();

    async function loadJSON(url) {
      try {
        const res = await fetch(url + '?t=' + CACHE_BUST, { cache: 'no-store' });
        if (!res.ok) return null;
        return await res.json();
      } catch { return null; }
    }

    function renderHero(data) {
      if (!data) return;
      const html = `
        <p class="hero-eyebrow">${data.eyebrow || ''}</p>
        <h1>${data.headline || ''}</h1>
        <p class="hero-lead">${data.lead || ''}</p>
        <div class="hero-actions">
          <a href="#kontakt" class="btn-primary">${data.cta_primary || ''}</a>
          <a href="#arbeiten" class="btn-outline-light">${data.cta_secondary || ''}</a>
        </div>
        <div style="margin-top: 48px; display: flex; gap: 8px; flex-wrap: wrap;">
          ${(data.badges || []).map(b => `<span class="badge-chip">${b}</span>`).join('')}
        </div>`;
      document.getElementById('hero-content').innerHTML = html;
    }

    function renderServices(data) {
      if (!data) return;
      const html = `
        <p class="section-eyebrow">${data.eyebrow || ''}</p>
        <h2 class="section-title">${data.title || ''}</h2>
        <p class="section-desc">${data.description || ''}</p>
        <div class="services-grid">
          ${(data.items || []).map(item => `
            <div class="service-card">
              <div class="service-card-icon">${item.icon || ''}</div>
              <h3>${item.title || ''}</h3>
              <p>${item.description || ''}</p>
            </div>
          `).join('')}
        </div>`;
      document.getElementById('services-content').innerHTML = html;
    }

    function renderStats(data) {
      if (!data) return;
      const html = `
        <div class="speechmark" style="margin: 0 auto 32px;">"</div>
        <p class="section-eyebrow">${data.eyebrow || ''}</p>
        <h2 class="section-title" style="max-width: 600px; margin-left: auto; margin-right: auto;">${data.title || ''}</h2>
        <div class="stats-row">
          ${(data.items || []).map(item => `
            <div class="stat-item">
              <div class="stat-number"><strong>${item.number || ''}</strong></div>
              <div class="stat-label">${item.label || ''}</div>
            </div>
          `).join('')}
        </div>`;
      document.getElementById('stats-content').innerHTML = html;
    }

    function renderProcess(data) {
      if (!data) return;
      const html = `
        <p class="section-eyebrow">${data.eyebrow || ''}</p>
        <h2 class="section-title">${data.title || ''}</h2>
        <p class="section-desc">${data.description || ''}</p>
        <div class="process-grid">
          ${(data.steps || []).map((step, i) => `
            <div class="process-step">
              <div class="process-number">${String(i + 1).padStart(2, '0')}</div>
              <h3>${step.title || ''}</h3>
              <p>${step.description || ''}</p>
            </div>
          `).join('')}
        </div>`;
      document.getElementById('process-content').innerHTML = html;
    }

    function renderPortfolios(entries) {
      const data = { eyebrow: 'Aus unserem Portfolio', title: 'Projekte, auf die wir <strong>stolz</strong> sind.', description: 'Eine kleine Auswahl unserer Lieblingsprojekte aus den letzten Jahren.' };
      const items = (entries || []).filter(Boolean);
      const html = `
        <p class="section-eyebrow">${data.eyebrow}</p>
        <h2 class="section-title">${data.title}</h2>
        <p class="section-desc">${data.description}</p>
        <div class="work-grid">
          ${items.map(p => `
            <div class="work-card">
              <div class="work-card-img">Projekt-Vorschau</div>
              <div class="work-card-body">
                <h3>${p.title || ''}</h3>
                <p>${p.description || ''}</p>
                ${(p.tags || []).map(t => `<span class="badge-chip">${t}</span>`).join(' ')}
              </div>
            </div>
          `).join('')}
        </div>`;
      document.getElementById('portfolios-content').innerHTML = html;
    }

    function renderContact(data) {
      if (!data) return;
      const html = `
        <p class="section-eyebrow">${data.eyebrow || ''}</p>
        <h2 class="section-title">${data.title || ''}</h2>
        <p class="section-desc">${data.description || ''}</p>
        <div class="contact-grid">
          <div class="contact-info">
            <div class="speechmark" style="margin-bottom: 24px;">"</div>
            <h3>${data.company || ''}</h3>
            <p>${data.address || ''}</p>
            <p style="margin-top: 16px;">
              <a href="tel:${(data.phone || '').replace(/[^+\d]/g, '')}">${data.phone || ''}</a><br />
              <a href="mailto:${data.email || ''}">${data.email || ''}</a>
            </p>
            <p style="margin-top: 24px; font-size: 14px; font-weight: 400; line-height: 16px; color: var(--body);">
              ${data.hours || ''}
            </p>
          </div>
          <form class="contact-form">
            <input type="text" placeholder="Name" required />
            <input type="email" placeholder="E-Mail" required />
            <input type="text" placeholder="Unternehmen (optional)" />
            <textarea placeholder="Ihr Projekt — erzählen Sie uns davon ..." required></textarea>
            <button type="submit" class="btn-primary" style="align-self: flex-start; border: none; cursor: pointer;">Nachricht senden</button>
          </form>
        </div>`;
      document.getElementById('contact-content').innerHTML = html;
    }

    function renderFooter(data) {
      if (!data) return;
      const html = `
        <div class="footer-grid">
          <div class="footer-brand">
            <a href="#start" class="nav-logo" style="text-decoration: none;">
              <span class="nav-logo-orb">NF</span>
              <span class="nav-logo-text">Nordflag</span>
            </a>
            <p>${data.description || ''}</p>
          </div>
          ${(data.columns || []).map(col => `
            <div class="footer-col">
              <h4>${col.heading || ''}</h4>
              <ul>
                ${(col.links || []).map(link => `
                  <li><a href="${link.url || '#'}">${link.label || ''}</a></li>
                `).join('')}
              </ul>
            </div>
          `).join('')}
        </div>
        <div class="footer-bottom">
          <p>&copy; ${new Date().getFullYear()} Nordflag Webagentur Lübeck</p>
          <p>Mit ❤️ aus der Hansestadt</p>
        </div>`;
      document.getElementById('footer-content').innerHTML = html;
    }

    async function init() {
      const [hero, services, stats, process, contact, footer] = await Promise.all([
        loadJSON('content/hero.json'),
        loadJSON('content/services.json'),
        loadJSON('content/stats.json'),
        loadJSON('content/process.json'),
        loadJSON('content/contact.json'),
        loadJSON('content/footer.json')
      ]);

      renderHero(hero);
      renderServices(services);
      renderStats(stats);
      renderProcess(process);
      renderContact(contact);
      renderFooter(footer);

      const portfolioFiles = ['luebeck-porzellan', 'travemuende-tourismus', 'nordstart-ventures'];
      const portfolios = await Promise.all(
        portfolioFiles.map(f => loadJSON(`content/portfolios/${f}.json`))
      );
      renderPortfolios(portfolios);
    }

    init();
  </script>

</body>
</html>
