backend:
  name: github
  repo: kimdrabe/nordflag-landing
  branch: main
  base_url: https://oauth.decap.org

publish_mode: editorial_workflow
media_folder: "images"
public_folder: "/images"

collections:
  - name: "hero"
    label: "Hero"
    delete: false
    files:
      - name: "hero"
        label: "Hero-Sektion"
        file: "content/hero.json"
        format: "json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Überschrift (mit <br> für Zeilenumbrüche)", name: "headline", widget: "text" }
          - { label: "Lead-Text", name: "lead", widget: "text" }
          - { label: "CTA Primary", name: "cta_primary", widget: "string" }
          - { label: "CTA Secondary", name: "cta_secondary", widget: "string" }
          - { label: "Badges", name: "badges", widget: "list", field: { label: "Badge", name: "badge", widget: "string" } }

  - name: "services"
    label: "Leistungen"
    delete: false
    files:
      - name: "services"
        label: "Leistungs-Sektion"
        file: "content/services.json"
        format: "json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Titel", name: "title", widget: "text" }
          - { label: "Beschreibung", name: "description", widget: "text" }
          - label: "Leistungen"
            name: "items"
            widget: "list"
            fields:
              - { label: "Icon (ein Buchstabe/Zeichen)", name: "icon", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "description", widget: "text" }

  - name: "stats"
    label: "Statistiken"
    delete: false
    files:
      - name: "stats"
        label: "Zahlen-Sektion"
        file: "content/stats.json"
        format: "json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Titel", name: "title", widget: "text" }
          - label: "Statistiken"
            name: "items"
            widget: "list"
            fields:
              - { label: "Zahl (z.B. 12+)", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

  - name: "process"
    label: "Prozess"
    delete: false
    files:
      - name: "process"
        label: "Prozess-Sektion"
        file: "content/process.json"
        format: "json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Titel", name: "title", widget: "text" }
          - { label: "Beschreibung", name: "description", widget: "text" }
          - label: "Schritte"
            name: "steps"
            widget: "list"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "description", widget: "text" }

  - name: "portfolios"
    label: "Portfolio"
    label_singular: "Projekt"
    folder: "content/portfolios"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Beschreibung", name: "description", widget: "text" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        field: { label: "Tag", name: "tag", widget: "string" }

  - name: "contact"
    label: "Kontakt"
    delete: false
    files:
      - name: "contact"
        label: "Kontakt-Sektion"
        file: "content/contact.json"
        format: "json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Titel", name: "title", widget: "text" }
          - { label: "Beschreibung", name: "description", widget: "text" }
          - { label: "Firmenname", name: "company", widget: "string" }
          - { label: "Adresse", name: "address", widget: "text" }
          - { label: "Telefon", name: "phone", widget: "string" }
          - { label: "E-Mail", name: "email", widget: "string" }
          - { label: "Öffnungszeiten", name: "hours", widget: "text" }

  - name: "footer"
    label: "Footer"
    delete: false
    files:
      - name: "footer"
        label: "Footer"
        file: "content/footer.json"
        format: "json"
        fields:
          - { label: "Beschreibung", name: "description", widget: "text" }
          - label: "Spalten"
            name: "columns"
            widget: "list"
            fields:
              - { label: "Spalten-Überschrift", name: "heading", widget: "string" }
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Link-Text", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
